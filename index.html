<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo do Número Secreto</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Jogo do Número Secreto</h1>

        <p id="mensagem">
            Escolha um número entre 1 e 100
        </p>

        <input type="number" id="inputNumero">

        <div class="botoes">
            <button onclick="verificarChute()">
                Chutar
            </button>

            <button onclick="reiniciarJogo()">
                Reiniciar
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
